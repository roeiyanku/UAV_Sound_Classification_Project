name: Fix normal reference calibration

on:
  push:
    paths:
      - "scripts/fix_normal_reference_calibration.py"
      - ".github/workflows/fix-normal-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Correct normal-reference calibration
        run: python scripts/fix_normal_reference_calibration.py

      - name: Commit corrected page
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "No page changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Fix normal example calibration"
          git push
