name: Cleanup demo patch files

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.issue.title == 'Cleanup prepared demo fix files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary files
        run: |
          rm -f \
            .github/workflows/patch-live-demo.yml \
            .github/workflows/patch-live-demo-pr.yml \
            .github/workflows/patch-live-demo-issue.yml \
            .github/workflows/cleanup-demo-fix.yml \
            scripts/patch_demo.py \
            .demo-fix-trigger \
            demo-fix-request.md \
            demo-fix-request-2.md \
            demo-fix-request-3.md \
            demo-fix-request-4.md \
            demo-fix-request-5.md \
            demo-fix-request-6.md \
            demo-fix-request-7.md
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary live demo patch files"
          git push
