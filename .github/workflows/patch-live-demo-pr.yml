name: Patch live demo from PR

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - .demo-fix-trigger

permissions:
  contents: write

jobs:
  patch-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply the prepared demo patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
            ('.prediction-label strong.normal{color:var(--green)}', '.prediction-label strong.normal{color:var(--green)}.prediction-label strong.uncertain{color:var(--amber)}'),
            ('.seg.drone{background:var(--red)}', '.seg.drone{background:var(--red)}.seg.uncertain{background:var(--amber)}'),
            ('green = normal · red = drone', 'green = normal · amber = uncertain · red = drone'),
            ('  const MAX_SECONDS = 60;\n  const THRESHOLD = 0.5;', '  const MAX_SECONDS = 60;\n  const UAV_THRESHOLD = 0.70;\n  const NORMAL_THRESHOLD = 0.30;\n  const MIN_REMAINDER_FRACTION = 0.50;'),
            ('The model expects one-second windows. For multi-second audio, the overall decision uses the highest drone score while the chart preserves every window.', 'The model expects one-second windows. A score from 30% to 70% is shown as uncertain rather than forced into a UAV or normal decision. Very short trailing fragments are ignored.'),
            ('Research prototype. The displayed score is the model’s quantized softmax output, not an operational threat assessment. Current published metrics use the saved random clip-level test split.', 'Research prototype. The displayed score is the model’s quantized softmax output, not an operational threat assessment. Scores between 30% and 70% are intentionally reported as uncertain. Current published metrics use the saved random clip-level test split.'),
          ]
          for old, new in replacements:
            if old not in text:
              raise RuntimeError(f'Missing expected text: {old[:80]}')
            text = text.replace(old, new, 1)

          old_predict = r'''  function predictClip(model, clip) {
    const quantized = quantizeClip(clip);
    const inputTensor = tf.tensor(quantized, [1, CLIP_SAMPLES, 1], 'int32');
    let outputTensor;
    try {
      outputTensor = model.predict(inputTensor);
      const raw = outputTensor.dataSync();
      const droneScore = Math.max(0, Math.min(1, (raw[0] - OUTPUT_ZERO_POINT) * OUTPUT_SCALE));
      const normalScore = Math.max(0, Math.min(1, (raw[1] - OUTPUT_ZERO_POINT) * OUTPUT_SCALE));
      return [droneScore, normalScore];
    } finally {
      inputTensor.dispose();
      if (outputTensor && typeof outputTensor.dispose === 'function') outputTensor.dispose();
    }
  }
'''
          new_predict = r'''  function classifyScore(droneScore) {
    if (droneScore >= UAV_THRESHOLD) return 'drone';
    if (droneScore <= NORMAL_THRESHOLD) return 'normal';
    return 'uncertain';
  }

  function predictClip(model, clip) {
    const quantized = quantizeClip(clip);
    const inputTensor = tf.tensor(quantized, [1, CLIP_SAMPLES, 1], 'int32');
    let outputTensor;
    try {
      outputTensor = model.predict(inputTensor);
      const raw = outputTensor.dataSync();
      let droneScore = Math.max(0, Math.min(1, (raw[0] - OUTPUT_ZERO_POINT) * OUTPUT_SCALE));
      let normalScore = Math.max(0, Math.min(1, (raw[1] - OUTPUT_ZERO_POINT) * OUTPUT_SCALE));
      const total = droneScore + normalScore;
      if (total > 0) {
        droneScore /= total;
        normalScore /= total;
      }
      return [droneScore, normalScore];
    } finally {
      inputTensor.dispose();
      if (outputTensor && typeof outputTensor.dispose === 'function') outputTensor.dispose();
    }
  }
'''
          if old_predict not in text:
            raise RuntimeError('Prediction block not found')
          text = text.replace(old_predict, new_predict, 1)

          start = text.index('  async function analyze(audio) {')
          end = text.index('\n  function renderResult(data) {', start)
          new_analyze = r'''  async function analyze(audio) {
    const model = await loadModel();
    const started = performance.now();
    const segments = [];
    const starts = [];

    if (audio.length <= CLIP_SAMPLES) {
      starts.push(0);
    } else {
      for (let start = 0; start + CLIP_SAMPLES <= audio.length; start += CLIP_SAMPLES) {
        starts.push(start);
      }
      const remainder = audio.length % CLIP_SAMPLES;
      if (remainder >= CLIP_SAMPLES * MIN_REMAINDER_FRACTION) {
        const tailStart = audio.length - CLIP_SAMPLES;
        if (!starts.length || tailStart > starts[starts.length - 1]) starts.push(tailStart);
      }
    }

    for (const start of starts) {
      const actualSamples = Math.min(CLIP_SAMPLES, audio.length - start);
      const clip = new Float32Array(CLIP_SAMPLES);
      clip.set(audio.subarray(start, start + actualSamples));
      const [droneScore, normalScore] = predictClip(model, clip);
      segments.push({
        index: segments.length,
        start_s: start / SAMPLE_RATE,
        end_s: Math.min(start + CLIP_SAMPLES, audio.length) / SAMPLE_RATE,
        drone_score: droneScore,
        normal_score: normalScore,
        label: classifyScore(droneScore)
      });
      await new Promise(resolve => setTimeout(resolve, 0));
    }

    if (!segments.length) throw new Error('No audio samples were decoded.');
    const peakSegment = segments.reduce((best, item) => item.drone_score > best.drone_score ? item : best);
    const inferenceMs = performance.now() - started;
    return {
      label: classifyScore(peakSegment.drone_score),
      drone_score: peakSegment.drone_score,
      peak_start_s: peakSegment.start_s,
      peak_end_s: peakSegment.end_s,
      duration_s: audio.length / SAMPLE_RATE,
      segments_analyzed: segments.length,
      drone_segments: segments.filter(item => item.label === 'drone').length,
      uncertain_segments: segments.filter(item => item.label === 'uncertain').length,
      inference_ms_total: inferenceMs,
      segments
    };
  }
'''
          text = text[:start] + new_analyze + text[end:]

          start = text.index('  function renderResult(data) {')
          end = text.index('\n  async function runFile(file) {', start)
          new_render = r'''  function renderResult(data) {
    const labelText = {drone: 'UAV detected', normal: 'No UAV detected', uncertain: 'Uncertain result'};
    label.textContent = labelText[data.label];
    label.className = data.label;
    score.textContent = `${(data.drone_score * 100).toFixed(1)}%`;
    document.getElementById('peakWindow').textContent = `${data.peak_start_s.toFixed(1)}–${data.peak_end_s.toFixed(1)} s`;
    document.getElementById('windowCount').textContent = `${data.drone_segments} UAV · ${data.uncertain_segments} uncertain · ${data.segments_analyzed} total`;
    document.getElementById('audioDuration').textContent = `${data.duration_s.toFixed(2)} s`;
    document.getElementById('inferenceTime').textContent = `${data.inference_ms_total.toFixed(1)} ms`;
    timeline.innerHTML = '';
    data.segments.forEach(seg => {
      const bar = document.createElement('div');
      bar.className = `seg ${seg.label}`;
      bar.style.height = `${Math.max(8, seg.drone_score * 100)}%`;
      bar.dataset.tip = `${seg.start_s.toFixed(1)}–${seg.end_s.toFixed(1)}s · UAV score ${(seg.drone_score * 100).toFixed(1)}% · ${seg.label}`;
      timeline.appendChild(bar);
    });
  }
'''
          text = text[:start] + new_render + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          grep -q "const UAV_THRESHOLD = 0.70" docs/index.html
          grep -q "Uncertain result" docs/index.html
          grep -q "amber = uncertain" docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Fix live demo confidence and window handling"
          git push origin HEAD:${{ github.head_ref }}
