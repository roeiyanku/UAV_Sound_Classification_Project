name: Diagnose TFLite demo

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.issue.title == 'Run TFLite demo diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TensorFlow
        run: pip install --quiet tensorflow-cpu==2.18.0
      - name: Run diagnostics
        run: python scripts/diagnose_tflite.py
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/tflite_demo_report.json
          git commit -m "Add TFLite demo diagnostic report"
          git push
